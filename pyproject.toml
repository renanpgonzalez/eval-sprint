[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "evalsprint"
version = "0.2.0"
description = "Eval Sprint kit: test sets, calibrated LLM-as-judge, quality/cost reports and CI regression gates for LLM features."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Renan Gonzalez" }]
license = { text = "MIT" }
keywords = ["llm", "evals", "llm-as-judge", "regression-testing", "ci", "observability"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Testing",
    "Private :: Do Not Upload",  # installed from git in client repos (see evalsprint/templates/evals/requirements.txt), never from PyPI
]
dependencies = ["pyyaml>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
evalsprint = "evalsprint.cli:main"

[tool.setuptools.packages.find]
include = ["evalsprint*"]
namespaces = false  # evalsprint/templates/ is data, not a package: only directories with an __init__.py are packages

[tool.setuptools.package-data]
# `evalsprint init` reads the client-repo starting points from inside the installed package (importlib.resources),
# so a `pip install` from git or from a wheel has them: nothing depends on a checkout of this repository.
evalsprint = [
    "pricing.yaml",
    "templates/*.yaml",
    "templates/*.jsonl",
    "templates/*.py",
    "templates/evals/*",
    "templates/github/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
