# Default price table, USD per 1M tokens.
# Verified on 2026-09-29. Prices change: override per project with
# `pricing:` in eval.yaml instead of editing this file.
#
# Sources:
#   Anthropic: https://platform.claude.com/docs/en/about-claude/pricing
#   OpenAI:    https://benchlm.ai/openai/api-pricing (third-party tracker, updated 2026-09-28;
#              confirm on https://openai.com/api/pricing before quoting to a client)
#
# Model ids are matched exactly first, then by longest prefix
# (so "claude-haiku-4-5-20251001" uses "claude-haiku-4-5").
# Batch API: both vendors discount 50%. Set `batch: true` on a model entry override if used.

models:
  # --- Anthropic ---
  claude-fable-5-1:   {input: 10.00, output: 50.00, cache_read: 0.25, cache_write: 12.50}
  claude-opus-5-5:    {input: 4.00,  output: 20.00, cache_read: 0.20, cache_write: 5.00}
  claude-sonnet-5-5:  {input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-haiku-4-5:   {input: 1.00,  output: 5.00,  cache_read: 0.10, cache_write: 1.25}
  claude-opus-5:      {input: 5.00,  output: 25.00, cache_read: 0.50, cache_write: 6.25}
  claude-sonnet-5:    {input: 2.00,  output: 10.00, cache_read: 0.20, cache_write: 2.50}
  claude-sonnet-4-6:  {input: 3.00,  output: 15.00, cache_read: 0.30, cache_write: 3.75}
  claude-sonnet-4-5:  {input: 3.00,  output: 15.00, cache_read: 0.30, cache_write: 3.75}

  # --- OpenAI ---
  gpt-5.6-sol:        {input: 4.00,  output: 20.00, cache_read: 0.40}   # promo price until 2026-11-21
  gpt-5.6-terra:      {input: 2.00,  output: 12.00, cache_read: 0.20}
  gpt-5.6-luna:       {input: 0.20,  output: 1.20,  cache_read: 0.02}
  gpt-5.5:            {input: 5.00,  output: 30.00, cache_read: 0.50}
  gpt-5.4:            {input: 2.50,  output: 15.00, cache_read: 0.25}
  gpt-5.4-mini:       {input: 0.75,  output: 4.50,  cache_read: 0.075}
  gpt-5.4-nano:       {input: 0.20,  output: 1.25,  cache_read: 0.02}
  gpt-4o-mini:        {input: 0.15,  output: 0.60}
